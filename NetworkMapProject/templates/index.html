<!DOCTYPE html>
<html>
<head>
    <title>Network Scanner Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .status-open { color: green; }
        .status-closed { color: red; }
    </style>
</head>
<body>
    <h1>Network Scan Results</h1>
    <table>
        <thead>
            <tr>
                <th>Host</th>
                <th>Port</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <!-- Results will be populated by JavaScript -->
        </tbody>
    </table>
    
    <script>
        // Simple data display
        const results = {{ results|tojson }};
        
        const tableBody = document.querySelector('tbody');
        
        for (const [host, ports] of Object.entries(results)) {
            for (const [port, status] of Object.entries(ports)) {
                const row = document.createElement('tr');
                
                const hostCell = document.createElement('td');
                hostCell.textContent = host;
                row.appendChild(hostCell);
                
                const portCell = document.createElement('td');
                portCell.textContent = port;
                row.appendChild(portCell);
                
                const statusCell = document.createElement('td');
                statusCell.textContent = status ? 'Open' : 'Closed';
                statusCell.className = status ? 'status-open' : 'status-closed';
                row.appendChild(statusCell);
                
                tableBody.appendChild(row);
            }
        }
    </script>
</body>
</html>
